name: Publish open packages
# A version bump landing on main is the release: each workspace version absent
# from the registry is published once. A partially failed run is repaired by the
# next push, or by rerunning this workflow.
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Trusted publishing needs npm 11.5.1+; `bb plugin build` needs the bb CLI.
      - run: npm install -g npm@11 bb-app
      - run: bun install
      - run: bun run build
      - name: Publish versions absent from the registry
        run: |
          shopt -s nullglob
          for manifest in packages/*/package.json; do
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            if jq -e .private "$manifest" >/dev/null; then
              echo "$manifest is marked private" >&2; exit 1
            fi
            if seen=$(npm view "$name@$version" version 2>&1); then
              echo "Published: $name@$version"
            elif grep -q E404 <<<"$seen"; then
              echo "Publishing: $name@$version"
              (cd "${manifest%/*}" && npm publish --access public --provenance)
            else
              echo "$seen" >&2; exit 1
            fi
          done
