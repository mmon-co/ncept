name: Publish open packages
# Serialize registry version selection. Each run publishes the current landing's packed changes.
on:
  push:
    branches: [main]
concurrency:
  group: publish-open-packages
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Trusted publishing needs npm 11.5.1+. The bb build stamps the CLI version into the tarball.
      - run: npm install -g npm@11 bb-app@0.49.0
      - run: bun install
      - name: Check installed consumers, then publish versions absent from the registry
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main)
          if [ "$(git rev-parse HEAD)" != "${main%%[[:space:]]*}" ]; then
            echo 'Skipping publication: a newer landing superseded this run.'
            exit 0
          fi
          bun release.mjs --publish
